version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schemas:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync always --maxmemory 1gb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER}
      AI_FALLBACK_PROVIDER_2: ${AI_FALLBACK_PROVIDER_2}
      AI_FALLBACK_PROVIDER_3: ${AI_FALLBACK_PROVIDER_3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      INSTAGRAM_PROXY_URL: ${INSTAGRAM_PROXY_URL}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - assets_data:/app/assets

  orchestrator:
    build: ./backend
    command: python -m orchestrator.engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER}
      AI_FALLBACK_PROVIDER_2: ${AI_FALLBACK_PROVIDER_2}
      AI_FALLBACK_PROVIDER_3: ${AI_FALLBACK_PROVIDER_3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  telegram_bot:
    build: ./backend
    command: python -m domains.approvals.telegram_bot
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  assets_data:
