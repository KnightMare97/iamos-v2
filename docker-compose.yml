version: "3.9"

x-backend-base: &backend-base
  build: 
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - ./backend:/app
    - assets_data:/app/assets

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: iamos_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-iamos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-iamos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iamos_redis
    command: redis-server --appendonly yes --appendfsync always --maxmemory 1gb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend-base
    container_name: iamos_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    <<: *backend-base
    container_name: iamos_orchestrator
    command: python -m orchestrator.engine

  telegram_bot:
    <<: *backend-base
    container_name: iamos_telegram_bot
    command: python -m domains.approvals.telegram_bot

volumes:
  postgres_data:
  redis_data:
  assets_data:
